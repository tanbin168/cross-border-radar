services:
  - type: web
    name: cross-border-radar
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: REFRESH_INTERVAL_HOURS
        value: 6
